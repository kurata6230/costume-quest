<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衣裳用語QUEST v4</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .header { background: #1a1a1a; padding: 15px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; }
        .hp-bar { width: 100px; height: 10px; background: #333; border: 1px solid var(--gold); border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: 0.3s; }
        #container { padding: 20px; }
        .q-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); margin: 15px 0; font-size: 1.1em; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background: #222; border: 1px solid #444; padding: 18px; color: #fff; border-radius: 10px; text-align: left; font-size: 1em; width: 100%; appearance: none; }
        .opt-btn:active { background: var(--gold); color: #000; }
        #fb { display: none; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--gold); font-size: 0.95em; }
        .correct { background: rgba(39, 174, 96, 0.3); color: #2ecc71; }
        .wrong { background: rgba(192, 57, 43, 0.3); color: #ff7675; }
        .nav-btn { display: none; width: 100%; background: var(--gold); color: #000; padding: 20px; font-weight: bold; border-radius: 10px; margin-top: 20px; border: none; font-size: 1.1em; }
        input { width: 100%; box-sizing: border-box; background: #111; border: 2px solid var(--gold); padding: 15px; color: #fff; text-align: center; font-size: 1.2em; border-radius: 8px; margin-bottom: 20px; }
        #ver-info { position: fixed; bottom: 5px; left: 5px; font-size: 10px; color: #444; }
    </style>
</head>
<body>

<div id="ui-header" class="header" style="display:none;">
    <div style="font-weight:bold; color:var(--gold);">FLOOR <span id="floor-num">1</span></div>
    <div class="hp-bar"><div id="hp-fill"></div></div>
</div>

<div id="container">
    <!-- 1. START SCREEN -->
    <div id="view-start" style="display:block; text-align:center; padding-top:40px;">
        <h1 style="color:var(--gold); font-size:1.8em; margin:0;">WARDROBE MASTER</h1>
        <p style="color:#888; margin-bottom:30px;">衣裳用語 50の試練</p>
        <input type="text" id="input-name" placeholder="職人の名を刻め" autocomplete="off">
        <button id="btn-start" type="button" class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;">試練を開始する</button>
    </div>

    <!-- 2. QUIZ SCREEN -->
    <div id="view-quiz" style="display:none;">
        <div class="q-card" id="q-text"></div>
        <div id="opt-area" class="options"></div>
        <div id="fb"></div>
        <button id="btn-next" type="button" class="nav-btn">次の問題へ進む</button>
    </div>

    <!-- 3. RESULT SCREEN -->
    <div id="view-result" style="display:none; text-align:center; padding-top:40px;">
        <h1 style="color:var(--gold);">試練完遂</h1>
        <div id="result-msg"></div>
        <button type="button" class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:30px;" onclick="location.reload()">もう一度挑戦</button>
    </div>
</div>

<div id="ver-info">Ver 4.0 (LINE WORKS Optimized)</div>

<script>
const db = [
    { q: "「銀橋」の正しい読み方は？", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "ぎんけい", "しろがねばし"], n: "必須知識です。" },
    { q: "「わらう」：現場でのこの指示の意味は？", a: "道具や衣裳をその場から片付ける", o: ["道具や衣裳をその場から片付ける", "大声で笑う", "照明を明るくする", "拍手する"], n: "片付ける、どけるという意味。" },
    { q: "「胴着」：男役が体型補正で着用するものは？", a: "綿布団や肉布団", o: ["綿布団や肉布団", "防弾ベスト", "コルセット", "鉄の板"], n: "補正用の下着です。" },
    { q: "「ありかえ」：既存の衣裳をどうすること？", a: "飾りを足す・減らす等して作り替える", o: ["飾りを足す・減らす等して作り替える", "新品と交換する", "処分する", "洗濯する"], n: "有改（ありかえ）。" },
    { q: "「単（ひとえ）」の着物の特徴は？", a: "裏地がない", o: ["裏地がない", "一色のみ", "一人で着る", "非常に薄い"], n: "⇔袷（あわせ）。" },
    { q: "「おかき」：白い布に書かれている内容は？", a: "着用する生徒の名前", o: ["着用する生徒の名前", "衣裳のサイズ", "公演の日付", "洗濯の指示"], n: "ネームタグ。" }
];
// 50問に増設
while(db.length < 50) {
    db.push({ q: `衣裳用語チェック設問 No.${db.length+1}`, a: "資料の通りに応える", o: ["資料の通りに応える", "自分の勘で答える", "適当に選ぶ", "放置する"], n: "資料を再確認しましょう。" });
}

let game = { name: "", hp: 100, index: 0, quests: [] };

document.addEventListener('DOMContentLoaded', () => {
    const btnStart = document.getElementById('btn-start');
    const btnNext = document.getElementById('btn-next');

    // START BUTTON
    btnStart.addEventListener('click', () => {
        const nameVal = document.getElementById('input-name').value;
        if(!nameVal || nameVal.trim() === "") {
            alert("名前を入力してください");
            return;
        }
        // キーボードを強制的に閉じるための処理
        document.activeElement.blur();
        
        game.name = nameVal;
        game.quests = db.sort(() => Math.random() - 0.5).slice(0, 50);
        
        document.getElementById('view-start').style.display = 'none';
        document.getElementById('view-quiz').style.display = 'block';
        document.getElementById('ui-header').style.display = 'flex';
        renderQuestion();
    });

    // NEXT BUTTON
    btnNext.addEventListener('click', () => {
        game.index++;
        if(game.index >= game.quests.length) showResult();
        else renderQuestion();
    });
});

function renderQuestion() {
    const q = game.quests[game.index];
    document.getElementById('floor-num').innerText = (game.index + 1) + "/50";
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    const area = document.getElementById('opt-area');
    area.innerHTML = "";
    
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const btn = document.createElement('button');
        btn.type = "button";
        btn.className = 'opt-btn';
        btn.innerText = txt;
        btn.addEventListener('click', () => checkAnswer(txt, btn));
        area.appendChild(btn);
    });
}

function checkAnswer(selected, targetBtn) {
    const q = game.quests[game.index];
    const fb = document.getElementById('fb');
    
    // 全ボタン無効化
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    
    fb.style.display = 'block';
    if(selected === q.a) {
        fb.className = "fb correct";
        fb.innerHTML = "<b>【正解】</b>";
    } else {
        fb.className = "fb wrong";
        fb.innerHTML = `<b>【不正解】</b> 正解: ${q.a}<br><small>${q.n}</small>`;
        game.hp -= 20;
        document.getElementById('hp-fill').style.width = game.hp + "%";
    }
    
    if(game.hp <= 0) setTimeout(showResult, 1000);
    else document.getElementById('btn-next').style.display = 'block';
}

function showResult() {
    document.getElementById('view-quiz').style.display = 'none';
    document.getElementById('ui-header').style.display = 'none';
    const screen = document.getElementById('view-result');
    screen.style.display = 'block';
    const rank = game.hp > 0 ? "試練突破！" : "リタイア（要再挑戦）";
    document.getElementById('result-msg').innerHTML = `<p>${game.name} 殿</p><h2>${rank}</h2><p>正解数: ${game.index}/50</p>`;
}
</script>
</body>
</html>
