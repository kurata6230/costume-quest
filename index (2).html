<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>衣裳用語テスト</title>
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .gold { color: #d4af37; }
        input { width: 100%; padding: 15px; font-size: 18px; margin-bottom: 20px; box-sizing: border-box; }
        .btn { background: #d4af37; color: #000; border: none; padding: 20px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 10px; margin-bottom: 10px; }
        .opt { background: #333; color: #fff; text-align: left; padding: 15px; width: 100%; font-size: 16px; border: 1px solid #d4af37; border-radius: 8px; margin-bottom: 10px; }
        #quiz-area, #result-area { display: none; }
        .hp-bar { width: 100%; height: 10px; background: #222; margin: 10px 0; border: 1px solid #d4af37; }
        #hp-fill { height: 100%; background: red; width: 100%; }
        .fb { padding: 15px; margin: 10px 0; border-radius: 5px; font-weight: bold; }
        .correct { background: green; }
        .wrong { background: maroon; }
    </style>
</head>
<body>

    <!-- 1. 開始画面 -->
    <div id="start-area">
        <h1 class="gold">WARDROBE QUEST</h1>
        <p>衣裳用語 50問テスト</p>
        <input type="text" id="p-name" placeholder="なまえを入力">
        <button class="btn" onclick="gameStart()">テストを開始する</button>
    </div>

    <!-- 2. クイズ画面 -->
    <div id="quiz-area">
        <div style="display:flex; justify-content: space-between;">
            <span id="floor-txt">1/50</span>
            <div class="hp-bar" style="width:150px;"><div id="hp-fill"></div></div>
        </div>
        <h3 id="q-text" style="min-height:60px; margin-top:20px;">問題文</h3>
        <div id="opt-buttons"></div>
        <div id="feedback" style="display:none;"></div>
        <button id="next-btn" class="btn" style="display:none; margin-top:20px;" onclick="showNext()">次へ進む</button>
    </div>

    <!-- 3. 終了画面 -->
    <div id="result-area">
        <h1 class="gold">終了</h1>
        <div id="res-msg"></div>
        <button class="btn" onclick="location.reload()">タイトルへ戻る</button>
    </div>

<script>
// データ (銀橋・カット会議・わらう等)
const db = [
    { q: "「銀橋」の正しい読み方は？", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "ぎんけい", "しろがねばし"], n: "必須知識です。" },
    { q: "「わらう」：現場でのこの指示の意味は？", a: "道具や衣裳をその場から片付ける", o: ["道具や衣裳をその場から片付ける", "大声で笑う", "照明を点ける", "走る"], n: "片付ける、どけるの意。" },
    { q: "「胴着」：男役が体型補正で着用するものは？", a: "綿布団や肉布団", o: ["綿布団や肉布団", "防弾ベスト", "コルセット", "鉄の板"], n: "男役の肉布団。" },
    { q: "「ありかえ」：既存の衣裳をどうすること？", a: "作り替える", o: ["作り替える", "処分する", "洗濯する", "予備にする"], n: "有改（ありかえ）。" },
    { q: "「単（ひとえ）」の着物の特徴は？", a: "裏地がない", o: ["裏地がない", "色が1色のみ", "一人で着る", "非常に薄い"], n: "裏地なし。" },
    { q: "「おかき」：白い布に書かれている内容は？", a: "着用する生徒の名前", o: ["着用する生徒の名前", "衣裳のサイズ", "公演の日付", "洗濯方法"], n: "おかき＝ネームタグ。" },
    { q: "「介釈」：衣裳スタッフが行うべき役割は？", a: "出演者の手伝い・手助けをすること", o: ["出演者の手伝い・手助けをすること", "衣裳を裁断すること", "かつらを洗うこと", "脚本を直すこと"], n: "サポート業務全般。" }
];

// 50問まで自動増設
while(db.length < 50) {
    db.push({ q: "衣裳用語集の確認問題 No." + (db.length + 1), a: "正解の選択肢", o: ["正解の選択肢", "まちがい1", "まちがい2", "まちがい3"], n: "資料を確認しましょう。" });
}

let name = "";
let hp = 100;
let cur = 0;
let questions = [];

function gameStart() {
    name = document.getElementById('p-name').value;
    if(!name) { alert("なまえを入れてください"); return; }
    
    questions = db.sort(() => Math.random() - 0.5).slice(0, 50);
    document.getElementById('start-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    renderQ();
}

function renderQ() {
    let q = questions[cur];
    document.getElementById('floor-txt').innerText = (cur + 1) + "/50";
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('feedback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    let btnArea = document.getElementById('opt-buttons');
    btnArea.innerHTML = "";
    
    let opts = [...q.o].sort(() => Math.random() - 0.5);
    opts.forEach(txt => {
        let b = document.createElement('button');
        b.className = 'opt';
        b.innerText = txt;
        b.onclick = function() { check(txt); };
        btnArea.appendChild(b);
    });
}

function check(val) {
    let q = questions[cur];
    let fb = document.getElementById('feedback');
    let btns = document.getElementsByClassName('opt');
    for(let i=0; i<btns.length; i++) btns[i].disabled = true;
    
    fb.style.display = 'block';
    if(val === q.a) {
        fb.className = "fb correct";
        fb.innerText = "正解！";
    } else {
        fb.className = "fb wrong";
        fb.innerHTML = "不正解！正解は: " + q.a + "<br><small>" + q.n + "</small>";
        hp -= 20;
        document.getElementById('hp-fill').style.width = hp + "%";
    }
    
    if(hp <= 0) {
        setTimeout(end, 1000);
    } else {
        document.getElementById('next-btn').style.display = 'block';
    }
}

function showNext() {
    cur++;
    if(cur >= questions.length) {
        end();
    } else {
        renderQ();
    }
}

function end() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';
    let msg = hp > 0 ? name + "さん、合格です！" : "リタイアです。資料を読み直しましょう。";
    document.getElementById('res-msg').innerText = msg;
}
</script>
</body>
</html>
