<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衣裳用語QUEST</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; }
        .header { background: #1a1a1a; padding: 15px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .hp-bar { width: 100px; height: 10px; background: #333; border: 1px solid var(--gold); border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: 0.3s; }
        #container { padding: 20px; }
        .q-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); margin: 15px 0; font-size: 1.1em; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background: #222; border: 1px solid #444; padding: 18px; color: #fff; border-radius: 10px; text-align: left; font-size: 1em; -webkit-tap-highlight-color: transparent; }
        .opt-btn:active { background: var(--gold); color: #000; }
        .feedback { display: none; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--gold); }
        .correct { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border-color: #2ecc71; }
        .wrong { background: rgba(192, 57, 43, 0.2); color: #ff7675; border-color: #e74c3c; }
        .nav-btn { display: none; width: 100%; background: var(--gold); color: #000; padding: 18px; font-weight: bold; border-radius: 10px; margin-top: 20px; border: none; font-size: 1.1em; }
        input { width: 100%; box-sizing: border-box; background: transparent; border: 2px solid var(--gold); padding: 15px; color: #fff; text-align: center; font-size: 1.2em; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div id="ui" class="header" style="display:none;">
    <div style="font-weight:bold; color:var(--gold);">QUEST <span id="floor">1</span>/50</div>
    <div class="hp-bar"><div id="hp-fill"></div></div>
</div>
<div id="container">
    <div id="start-node" style="text-align:center; padding-top:50px;">
        <h1 style="color:var(--gold);">WARDROBE QUEST</h1>
        <p style="color:#888; margin-bottom:30px;">衣裳用語の試練（全50問）</p>
        <input type="text" id="p-name" placeholder="職人の名前を入力">
        <!-- onclickを修正 -->
        <button class="opt-btn" style="width:100%; text-align:center; background:var(--gold); color:#000; font-weight:bold;" onclick="handleStart()">クエスト開始</button>
    </div>
    <div id="quest-node" style="display:none;">
        <div class="q-card" id="q-text"></div>
        <div class="options" id="opt-container"></div>
        <div id="fb" class="feedback"></div>
        <button id="next-btn" class="nav-btn" onclick="render()">次の試練へ</button>
    </div>
    <div id="result-screen" style="display:none; text-align:center;"></div>
</div>

<script>
// データベース
const db = [
    { q: "「銀橋」の正しい読み方は？", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "ぎんけい", "しろがねばし"], n: "必須知識です。" },
    { q: "「ありかえ」：既存の衣裳をどうすること？", a: "飾りを足す・減らす等して作り替える", o: ["飾りを足す・減らす等して作り替える", "新品と交換する", "処分する", "洗濯する"], n: "p.2：有改（ありかえ）。" },
    { q: "「わらう」：現場でこの指示が出たら？", a: "衣裳や道具をその場から片付ける", o: ["衣裳や道具をその場から片付ける", "大声で笑う", "照明を点ける", "生徒に合図を送る"], n: "p.100：片付ける、どける。" },
    { q: "「胴着」：男役が体型補正で着用するものは？", a: "綿布団や肉布団", o: ["綿布団や肉布団", "防弾ベスト", "コルセット", "鉄の重り"], n: "p.13：男役の体型下着。" },
    { q: "「単（ひとえ）」の着物の特徴は？", a: "裏地がない", o: ["裏地がない", "一色のみ", "一人で着る", "一回しか使わない"], n: "p.16：単（ひとえ）。⇔袷。" }
];

let state = { floor: 0, hp: 100, quests: [], name: "" };

function handleStart() {
    const nameInput = document.getElementById('p-name').value;
    if(!nameInput || nameInput.trim() === "") {
        alert("名前を入力してください");
        return;
    }
    state.name = nameInput;
    state.quests = db.sort(() => Math.random() - 0.5).slice(0, 50);
    document.getElementById('start-node').style.display = 'none';
    document.getElementById('quest-node').style.display = 'block';
    document.getElementById('ui').style.display = 'flex';
    render();
}

function render() {
    if(state.floor >= state.quests.length) return end();
    const q = state.quests[state.floor];
    document.getElementById('floor').innerText = state.floor + 1;
    document.getElementById('q-text').innerText = q.q;
    const container = document.getElementById('opt-container');
    container.innerHTML = "";
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn'; b.innerText = txt;
        b.onclick = () => check(txt);
        container.appendChild(b);
    });
    document.getElementById('fb').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
}

function check(ans) {
    const q = state.quests[state.floor];
    const fb = document.getElementById('fb');
    fb.style.display = 'block';
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    if(ans === q.a) {
        fb.className = "feedback correct"; fb.innerHTML = "<b>正解！</b>";
        state.floor++; document.getElementById('next-btn').style.display = 'block';
    } else {
        fb.className = "feedback wrong"; fb.innerHTML = `<b>不正解</b><br>正解: ${q.a}<br><small>${q.n}</small>`;
        state.hp -= 20; document.getElementById('hp-fill').style.width = state.hp + "%";
        if(state.hp <= 0) setTimeout(end, 1000);
        else { state.floor++; document.getElementById('next-btn').style.display = 'block'; }
    }
}

function end() {
    document.getElementById('quest-node').style.display = 'none';
    document.getElementById('ui').style.display = 'none';
    const r = document.getElementById('result-screen');
    r.style.display = 'block';
    r.innerHTML = `<h1 style="color:var(--gold);">試練終了</h1><p>${state.name} 殿</p><p>正解数: ${state.floor}/50</p><button class="opt-btn" style="width:100%; text-align:center; background:var(--gold); color:#000; font-weight:bold;" onclick="location.reload()">タイトルへ</button>`;
}
</script>
</body>
</html>
