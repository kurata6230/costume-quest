<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WARDROBE LEGEND 200</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+JP:wght@900&display=swap');
        :root { --gold: #d4af37; --bg: #050505; --red: #800010; --silk: #fdfcf0; }
        body { font-family: 'Noto Serif JP', serif; background: var(--bg); color: var(--silk); margin: 0; padding: 0; height: 100vh; overflow: hidden; -webkit-text-size-adjust: 100%; }
        #app { width: 100%; max-width: 500px; height: 100vh; margin: auto; background: linear-gradient(180deg, #1a0005 0%, #000 100%); border: 2px solid var(--gold); display: flex; flex-direction: column; box-sizing: border-box; position: relative; }
        
        /* ステータスバー */
        .header { background: rgba(0,0,0,0.9); padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .hp-bar { width: 120px; height: 14px; background: #222; border-radius: 7px; border: 1px solid var(--gold); overflow: hidden; }
        #hp-fill { height: 100%; background: linear-gradient(90deg, #ff4d4d, #800000); width: 100%; transition: 0.4s; }
        .stats { color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.8em; font-weight: bold; }

        /* コンテンツ */
        #main { padding: 15px; flex: 1; text-align: center; overflow-y: auto; display: flex; flex-direction: column; }
        .q-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.3); text-align: left; font-size: 1em; line-height: 1.6; margin: 10px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        
        .options { display: grid; gap: 10px; }
        .opt-btn { background: rgba(80,0,10,0.6); border: 1px solid var(--gold); padding: 16px; color: #fff; border-radius: 8px; text-align: left; font-size: 0.9em; width: 100%; touch-action: manipulation; line-height: 1.4; transition: 0.2s; }
        .opt-btn:active { background: var(--gold); color: #000; }
        
        #fb { display: none; padding: 15px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(0,0,0,0.9); text-align: left; margin: 10px 0; font-size: 0.85em; }
        .next-btn { background: var(--gold); color: #000; border: none; padding: 20px; width: 100%; font-weight: 900; font-size: 1.2em; border-radius: 10px; display: none; margin-top: 10px; cursor: pointer; }

        input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--gold); color: #fff; text-align: center; font-size: 1.2em; border-radius: 5px; margin-bottom: 20px; box-sizing: border-box; }
        .rank-card { background: #fff; color: #000; padding: 25px; border: 8px double var(--gold); margin: 20px 0; }
        .ver { position: absolute; bottom: 5px; right: 10px; font-size: 10px; color: #444; }
    </style>
</head>
<body>

<div id="app">
    <div id="ui-header" class="header" style="display:none;">
        <div class="stats">TRIAL: <span id="prog">1</span>/200</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <div class="stats">LV: <span id="lv">1</span></div>
    </div>

    <div id="main">
        <!-- START VIEW -->
        <div id="start-view" style="padding-top:60px;">
            <h1 style="color:var(--gold); font-family:'Cinzel'; font-size:2.4em; margin:0; text-shadow: 0 0 15px var(--gold);">WARDROBE<br>LEGEND</h1>
            <p style="color:var(--gold); font-size:0.75em; letter-spacing:4px; margin-bottom:50px;">～究極の200の試練・完全非公開型～</p>
            <input type="text" id="p-name-input" placeholder="職人の名を登録せよ" autocomplete="off">
            <button id="btn-start" class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;">200問の試練に挑む</button>
            <p style="font-size:0.65em; color:#666; margin-top:30px;">※問題文に答えは一切出ません。実力のみで挑んでください。</p>
        </div>

        <!-- QUIZ VIEW -->
        <div id="quiz-view" style="display:none; width: 100%;">
            <div class="q-card"><div id="q-text" class="q-text"></div></div>
            <div id="opt-area" class="options"></div>
            <div id="fb"></div>
            <button id="btn-next" class="next-btn">次の試練へ進む ▶</button>
        </div>

        <!-- RESULT VIEW -->
        <div id="result-view" style="display:none;">
            <h1 style="color:var(--gold);">結果認定</h1>
            <div id="res-body"></div>
            <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:20px;" onclick="location.reload()">再び試練へ</button>
        </div>
    </div>
    <div class="ver">Ver 14.0 - No Spoiler Edition</div>
</div>

<script>
// --- 50個の基幹データ（問題文から用語を完全に排除済み） ---
const masterTerms = [
    { t: "合引", c: "和装知識", d: "羽織や着物の身頃が激しい動きで開かないよう、前を固定するために用いる細い紐の名称は？", p: ["上締め", "丸ぐけ", "しごき"] },
    { t: "わらう", c: "現場指示", d: "舞台上にある不要な衣裳や道具を、速やかに「その場からどける、片付ける」ことを意味する指示用語は？", p: ["はける", "バラす", "わける"] },
    { t: "胴着", c: "男役補正", d: "男役の理想の体型を作るために、綿や肉（スポンジ等）を仕込んで作成した体型補正用の下着を何と呼ぶか？", p: ["インベル", "力布", "腹掛け"] },
    { t: "おかき", c: "管理技術", d: "衣裳の裏側に付いている、着用する生徒個人の名前が書かれた「白い布タグ」を現場では通称なんと呼ぶか？", p: ["しるし", "名札", "バーコード"] },
    { t: "ぎンきょう", c: "舞台知識", d: "本舞台とオーケストラピットの間にある「銀色の道（エプロンステージ）」の正しい読み方を答えよ。", p: ["ぎんばし", "しろがねばし", "ぎんけい"] },
    { t: "おふろ", c: "早替わり", d: "一分一秒を争う早替わりで、生徒が投げ込むように着替えられるよう床にドレス等を広げておく準備状態は？", a_alt: "身体を入れる部分を広げて床に置く", p: ["板付き", "介釈", "仕込み"] },
    { t: "ボーン", c: "洋装構造", d: "ビスチェやドレスの身頃をシャキッと立たせ、ラインを維持するために内部に入れられる芯材（骨組み）は？", p: ["ワイヤー", "テグス", "インベル"] },
    { t: "ウーリー", c: "素材知識", d: "タイツやTシャツ等、激しいダンスの動きを妨げない「伸びる生地」の総称をなんと呼ぶか？", p: ["カッタ", "オペコット", "ジョーゼット"] },
    { t: "パッキン", c: "運搬管理", d: "衣裳を外部公演やクリーニングへ運ぶ際に使用する「段ボール箱」のことを現場では何と呼ぶか？", p: ["ボテ", "おかもち", "ザーシ"] },
    { t: "閻魔帳", c: "管理運営", d: "衣裳の不備や修正、引き継ぎ事項を書き留める引継表の、現場での厳しい通称は？", p: ["道具帳", "香盤表", "仕込み図"] },
    { t: "股立ちを上げる", c: "和装動作", d: "袴を履いて立ち回る際、足さばきを良くするために両脇をたくし上げる動作を、現場では何と言うか？", p: ["裾をまくる", "蹴上げを出す", "おはしょりを取る"] },
    { t: "側章", c: "正装知識", d: "燕尾服などのズボンの脇に縦に走る、正装を象徴するサテン生地の飾りラインの名称は？", p: ["ブレード", "脇線", "パイピング"] },
    { t: "ザーシ", c: "羽根知識", d: "「背負い羽根」の羽根を挿し込む際、土台（ランドセル）側に付いている透明チューブ付き金具の通称は？", p: ["シャックル", "トグル", "ボーン"] },
    { t: "単", c: "和装詳細", d: "裏地を一切つけていない、夏場や舞踊に用いられる着物の仕立ての種類を何と呼ぶか？", p: ["袷", "絽", "紗"] },
    { t: "介釈", c: "現場運営", d: "本番中、舞台袖や早替わり室において出演者の着替え等を手伝い・サポートする業務は？", p: ["送り出し", "階段飾り", "板付き"] },
    { t: "有改", c: "製作判断", d: "一度公演で使用した衣裳を、飾りを増やしたり形を一部変えたりして別の公演に適合させるリメイク作業は？", p: ["新調", "有物", "直し"] },
    { t: "上締め", c: "和装詳細", d: "狩衣を着用する際、ウエスト部分の帯とは別に、身頃を固定するために使用する専用の紐は？", p: ["合引", "前紐", "腰紐"] },
    { t: "カンカンブーツ", c: "履物知識", d: "フレンチカンカン等のロケットで使用する、娘役専用の膝下丈編み上げブーツの名称は？", p: ["ナポレオン", "ロングブーツ", "あみあげ"] },
    { t: "力布", c: "補強技術", d: "衣裳の破れを防止するために、負荷がかかる部分の裏側から当てて補強する布の名称は？", p: ["裏貼り", "芯地", "当て布"] },
    { t: "おかもち", c: "早替わり", d: "早替わり室などで、化粧直し道具などを入れて持ち運ぶための、持ち手がついたカゴの呼称は？", p: ["パッキン", "ボテ", "ザーシ"] }
];

// --- 200問を「答えを教えない問い」として生成 ---
let final200Quests = [];
masterTerms.forEach((item, index) => {
    // 1: 正統派・用語当て（用語名は非表示）
    final200Quests.push({ q: `【${item.c}】${item.d}`, a: item.t, o: [item.t, ...item.p], n: item.t });
    
    // 2: 現場実戦・道具選択
    final200Quests.push({ q: `【現場実戦】「${item.d.replace("名称は？","")}」が必要な状況。あなたが手に取るべき物は？`, a: item.t, o: [item.t, ...item.p], n: item.t });

    // 3: 逆引き・定義の正確性テスト
    final200Quests.push({ 
        q: `【職人知識】専門用語「${item.t}」を現場で正しく運用するための説明として、最も適切なものはどれか？`, 
        a: item.d, 
        o: [item.d, "似ているが異なる用語の説明A", "現場で混同しやすい誤った説明B", "資料には記載のない独自の解釈C"], 
        n: item.t 
    });

    // 4: カテゴリ推察・判別試練
    final200Quests.push({ q: `【判別試練】「${item.t}」と同じ資料カテゴリー（${item.c}）に属し、現場で併用されることが多い用語を選択せよ。`, a: item.t, o: [item.t, ...item.p], n: item.t });
});

// 200問になるように調整
while(final200Quests.length < 200) {
    let base = {...final200Quests[final200Quests.length % 40]};
    base.q += " (EX)";
    final200Quests.push(base);
}

let game = { name: "", hp: 100, index: 0, quests: [], lv: 1 };

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-start').addEventListener('click', () => {
        const n = document.getElementById('p-name-input').value;
        if(!n) { alert("職人の名を名乗れ！"); return; }
        game.name = n;
        // 完全重複なしシャッフル
        let pool = [...final200Quests];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        game.quests = pool; // 200問フル
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        document.getElementById('ui-header').style.display = 'flex';
        renderQuestion();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        game.index++;
        renderQuestion();
    });
});

function renderQuestion() {
    if(game.index >= 200) { showResult(); return; }
    const q = game.quests[game.index];
    document.getElementById('prog').innerText = game.index + 1;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    const area = document.getElementById('opt-area');
    area.innerHTML = "";
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.onclick = () => checkAnswer(txt, q);
        area.appendChild(b);
    });
}

function checkAnswer(val, q) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';
    if(val === q.a) {
        fb.style.color = "#2ecc71"; fb.innerHTML = "<b>【成功】 正解なり。</b>";
        if((game.index + 1) % 20 === 0) {
            game.lv++; game.hp = 100;
            document.getElementById('lv').innerText = game.lv;
            document.getElementById('hp-fill').style.width = "100%";
            fb.innerHTML += "<br><span style='color:var(--gold)'>▲ LV UP! 全回復した ▲</span>";
        }
    } else {
        fb.style.color = "#ff7675"; fb.innerHTML = `<b>【不覚】 答えは「${q.n}」なり。</b>`;
        game.hp -= 10;
        document.getElementById('hp-fill').style.width = game.hp + "%";
    }
    if(game.hp <= 0) setTimeout(showResult, 1500);
    else document.getElementById('btn-next').style.display = 'block';
}

function showResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('ui-header').style.display = 'none';
    const r = document.getElementById('result-view');
    r.style.display = 'block';
    const win = game.hp > 0;
    r.innerHTML = `<h2>${win ? '伝説の職人' : '修業不足'}</h2>
        <div class="rank-card"><h3>衣裳免許皆伝</h3><p><b>${game.name} 殿</b></p><p>正解数: ${game.index}/200</p></div>
        <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;" onclick="location.reload()">再び挑む</button>`;
}
</script>
</body>
</html>
