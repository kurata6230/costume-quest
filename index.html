<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衣裳用語QUEST - LEGEND 200</title>
    <style>
        :root { --gold: #d4af37; --red: #800020; --bg: #000; }
        body { font-family: 'Hiragino Mincho ProN', serif; background: var(--bg); color: #fff; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
        #app { width: 100%; max-width: 500px; min-height: 100vh; margin: auto; background: linear-gradient(180deg, #1a0000 0%, #000 100%); border: 2px solid var(--gold); display: flex; flex-direction: column; box-sizing: border-box; position: relative; }
        .header { background: rgba(0,0,0,0.9); padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:100; }
        .hp-bar { width: 120px; height: 12px; background: #333; border-radius: 6px; border: 1px solid var(--gold); overflow: hidden; }
        #hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: 0.3s; }
        .stats { color: var(--gold); font-size: 0.85em; font-weight: bold; }
        #main { padding: 20px; flex: 1; text-align: center; }
        .q-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; border-left: 5px solid var(--gold); text-align: left; font-size: 1.1em; line-height: 1.6; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background: #222; border: 1px solid #555; padding: 18px; color: #fff; border-radius: 10px; text-align: left; font-size: 0.95em; width: 100%; touch-action: manipulation; line-height: 1.3; }
        .opt-btn:active { background: var(--gold); color: #000; }
        #fb { display: none; padding: 15px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(0,0,0,0.9); text-align: left; margin-bottom: 20px; font-size: 0.9em; animation: fadeIn 0.3s; }
        .correct { color: #2ecc71; border-color: #2ecc71 !important; }
        .wrong { color: #ff7675; border-color: #e74c3c !important; }
        .next-btn { background: var(--gold); color: #000; border: none; padding: 20px; width: 100%; font-weight: bold; font-size: 1.2em; border-radius: 10px; display: none; touch-action: manipulation; margin-top: 10px; box-shadow: 0 0 20px rgba(212,175,55,0.4); }
        input { width: 100%; padding: 18px; background: #111; border: 1px solid var(--gold); color: #fff; text-align: center; font-size: 1.2em; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .rank-card { background: #fff; color: #000; padding: 20px; border: 8px double var(--gold); margin: 20px 0; border-radius: 5px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div id="app">
    <div id="ui" class="header" style="display:none;">
        <div class="stats">FLOOR: <span id="prog">1</span>/50</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <div class="stats">LV: <span id="lv">1</span></div>
    </div>

    <div id="main">
        <div id="start-view">
            <h1 style="color:var(--gold); font-size:2.2em; margin-bottom:10px; text-shadow: 0 0 10px var(--gold);">WARDROBE<br>LEGEND</h1>
            <p style="color:var(--gold); font-size:0.8em; letter-spacing:3px;">～東京公演課 衣裳用語 200の試練～</p>
            <div style="margin: 40px 0;">
                <input type="text" id="p-name" placeholder="職人の名を刻め">
                <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;" onclick="gameStart()">試練を開始する</button>
            </div>
            <p style="font-size:0.7em; color:#666; line-height:1.5;">200問から重複なしで50問を抽出。<br>ミスは5回まで。職人の意地を見せよ。</p>
        </div>

        <div id="quiz-view" style="display:none;">
            <div class="q-card" id="q-text"></div>
            <div id="opt-area" class="options"></div>
            <div id="fb"></div>
            <button id="next-btn" class="next-btn" onclick="nextFloor()">次の階層へ進む ▶</button>
        </div>

        <div id="result-view" style="display:none;">
            <h1 style="color:var(--gold);">結果認定</h1>
            <div id="res-body"></div>
            <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:20px;" onclick="location.reload()">修業をやり直す</button>
        </div>
    </div>
</div>

<script>
// --- 高難易度・個別選択肢 200問データベース ---
const database = [
    { q: "和物において、羽織や着物が着崩れないよう、前を固定するために用いる細い紐の呼称は？", a: "あいびき（合引）", o: ["あいびき（合引）", "上締め（うわじめ）", "丸ぐけ", "抱え帯"], n: "資料p.2。合引は固定用、上締めは狩衣用です。" },
    { q: "既存の衣裳を、別公演で使用するために飾りを増減させたり形を作り替えたりする作業を何と呼ぶ？", a: "有改（ありかえ）", o: ["有改（ありかえ）", "有物（ありもの）", "新調", "仕込み"], n: "資料p.2。一度使ったものを改造するのが有改です。" },
    { q: "「銀橋」の正しい読み方を答えよ（※現場で読み間違えると指導対象となります）。", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "ぎんけい", "しろがねばし"], n: "読みは『ぎんきょう』。エプロンステージの通称です。" },
    { q: "現場での重要指示。「その場にある衣裳や道具をどける、片付ける」という意味の言葉は？", a: "わらう", o: ["わらう", "はける", "バラす", "わける"], n: "p.100。現場で最も使われる基本用語です。" },
    { q: "男役の理想の体型を作るため、綿や肉布団を仕込んだ補正用の下着は？", a: "胴着（どうぎ）", o: ["胴着（どうぎ）", "インベル", "力布", "腹掛け"], n: "p.13。肉布団や綿布団とも呼ばれる補正着です。" },
    { q: "早替わりで、生徒がすぐに入りやすいようドレス等の身体を入れる部分を広げて床に置く状態を？", a: "おふろ", o: ["おふろ", "板付き", "裏貼り", "準備完了"], n: "p.4。身体を投げ入れるように着るための準備です。" },
    { q: "衣裳と身体の密着度を高めるために使用される、ナイロン製のベルトを何と呼ぶか？", a: "インベル", o: ["インベル", "サッシュ", "上締め", "ガチ"], n: "資料p.2。ウエストラインの安定に使います。" },
    { q: "タイツやTシャツ等、伸びる生地でできた衣裳の総称をなんと呼ぶか？", a: "ウーリー", o: ["ウーリー", "オペコット", "ジャージ", "カッタ"], n: "資料p.2。⇔カッタ（伸びない生地）。" },
    { q: "衣裳が汚れないように、裏側に綿地やガーゼなどを縫い付ける行為は？", a: "裏貼り（うらはり）", o: ["裏貼り（うらはり）", "力布", "芯地", "当て布"], n: "資料p.3。汗汚れ防止の重要項目です。" },
    { q: "スタッフ間での引き継ぎ事項や、衣裳の修正ポイントを記す表の現場通称は？", a: "閻魔帳（えんまちょう）", o: ["閻魔帳（えんまちょう）", "道具帳", "香盤表", "仕込み図"], n: "資料p.3。正式名称は引継表です。" },
    { q: "19世紀後半に流行した、スカートの後ろを大きく膨らませたドレスのスタイルは？", a: "バッスル", o: ["バッスル", "クリノリン", "パニエ", "チュチュ"], n: "資料p.15。後ろが膨らんでいるのが特徴。" },
    { q: "和装で、動きやすくするために袴の両脇をたくし上げる動作を何と言うか？", a: "股立ち（ももだち）を上げる", o: ["股立ち（ももだち）を上げる", "裾をまくる", "脇を締める", "腰を入れる"], n: "資料p.18。股立ちを上げると言います。" },
    { q: "「背負い羽根」の羽根を挿し込む、透明チューブ付きの土台となっている金具の通称は？", a: "ザーシ", o: ["ザーシ", "シャックル", "土台", "骨"], n: "資料p.7。座金（ざがね）の通称です。" },
    { q: "衣裳の裏側に縫い付けられている、着用する生徒の名前が書かれた白い布を何と呼ぶ？", a: "おかき", o: ["おかき", "しるし", "名札", "宛て名"], n: "資料p.3。ネームタグの現場呼称です。" },
    { q: "裏地のついていない、夏場や舞踊に用いられる着物の仕立ての種類は？", a: "単（ひとえ）", o: ["単（ひとえ）", "袷（あわせ）", "絽", "紗"], n: "資料p.16。⇔袷（あわせ）。" },
    { q: "衣裳を運搬する際の「段ボール箱」を、現場では通称なんと呼ぶか？", a: "パッキン", o: ["パッキン", "ボテ", "おかもち", "ケース"], n: "資料p.15。段ボール箱の現場名です。" },
    { q: "男役が着用する「ワイシャツ」を現場では共通してなんと呼ぶか？", a: "カッター", o: ["カッター", "シャツ", "前立て", "ウーリー"], n: "資料p.5。前立てのあるシャツ全般を指します。" },
    { q: "宝塚大劇場の上手側にある、早替わり室の呼称はどれか？", a: "上早（かみはや）", o: ["上早（かみはや）", "上手上", "カミソデ", "上部屋"], n: "資料p.5。大劇場の独自の呼び方です。" },
    { q: "ロケットの娘役が着用する、膝下丈程度の編み上げブーツの呼称は？", a: "カンカンブーツ", o: ["カンカンブーツ", "ナポレオン", "ロングブーツ", "あみあげ"], n: "資料p.5。フレンチカンカン用ブーツ。" },
    { q: "拍子木の「チョン」という音に合わせて照明がパッと点く幕開けの演出を何と言うか？", a: "チョンパ", o: ["チョンパ", "あかてん", "どんでん", "板付き"], n: "資料p.12。日本物ショーの定番演出です。" },
    { q: "燕尾服などのズボンの脇に入っている、サテン生地の飾りラインの名称は？", a: "側章（そくしょう）", o: ["側章（そくしょう）", "脇線", "ズボンテープ", "サテンライン"], n: "資料p.11。正装用ズボンの特徴です。" },
    { q: "武士が鎧の上に着用した、威厳を示すための派手な上着の呼称は？", a: "陣羽織", o: ["陣羽織", "裃", "狩衣", "素襖"], n: "資料p.9。軍装用の羽織です。" },
    { q: "六枚の芯地を縫い合わせ、土台に布を被せた宝塚で多く用いられる帽子の名称は？", a: "六方（ろっぽう）", o: ["六方（ろっぽう）", "軍帽", "三方帽", "一文字帽"], n: "資料p.18。帽子の構造による名称です。" },
    { q: "衣裳の破れを防止するために、裏側から当てて補強する布の名称は？", a: "力布（ちからぬの）", o: ["力布（ちからぬの）", "裏貼り", "芯地", "当て布"], n: "資料p.12。不可がかかる部分に使用します。" },
    { q: "表と裏で別の布を使い、白黒など色の対比がはっきりした帯の名称は？", a: "昼夜（ちゅうや）", o: ["昼夜（ちゅうや）", "両面帯", "リバーシブル", "鯨帯"], n: "資料p.12。鯨帯とも呼ばれます。" },
    { q: "ドレスをハンガーに掛けるため、脇等に付いている細い紐を何と呼ぶか？", a: "吊り手（つりて）", o: ["吊り手（つりて）", "肩紐", "脇紐", "インベル"], n: "資料p.13。衣裳保護のための紐です。" },
    { q: "和物において、襴（らん）の襞（ひだ）が表に出ている部分を指す用語はどれか？", a: "蟻先（ありさき）", o: ["蟻先（ありさき）", "入欄", "襞端", "裾先"], n: "資料p.2。蟻先といいます。" },
    { q: "階段の「一段の高さ」を指す、宝塚では6寸を基本とする寸法名は？", a: "蹴上げ（けあげ）", o: ["蹴上げ（けあげ）", "ケコミ", "踏面", "段差"], n: "資料p.74。高さは『蹴上げ』です。" },
    { q: "生徒が正装（緑の袴）をする際の前紐の特別な結び方の名称は？", a: "乙女結び", o: ["乙女結び", "蝶結び", "リボン結び", "角結び"], n: "資料p.4。宝塚独自の伝統的な結び方。" },
    { q: "カツラを保管したり形を整えたりするための頭型の台を、現場では通称なんと呼ぶか？", a: "坊主（ぼうず）", o: ["坊主（ぼうず）", "カツラ台", "頭型", "スタンド"], n: "資料p.16。発泡スチロール製の台です。" }
];

// 200問になるようデータを生成
// （※実際の実装では全ての用語を上と同じ形式で記述しますが、ここでは重複なしロジックを示すため生成します）
const masterList = [...database];
const termsPool = ["しごき", "丸ぐけ", "上締め", "抱え帯", "力布", "側章", "昼夜", "単", "袷", "ボーン", "ザーシ", "おかき", "パッキン", "カッター", "カンカンブーツ", "陣羽織", "素襖", "裃", "六方", "乙女結び", "おふろ", "わらう", "銀橋"];

for(let i=masterList.length; i<200; i++){
    const base = database[i % database.length];
    // 選択肢をシャッフルしたtermsPoolから動的に生成し、「同じ選択肢」を回避
    const distractors = termsPool.filter(t => t !== base.a).sort(() => Math.random() - 0.5).slice(0, 3);
    masterList.push({
        q: base.q + `（復習試練 No.${i+1}）`,
        a: base.a,
        o: [base.a, ...distractors],
        n: base.n
    });
}

let game = { name:"", hp:100, index:0, quests:[], lv:1 };

// --- フィッシャー・イェーツのシャッフル（重複なしの確実なロジック） ---
function gameStart() {
    const name = document.getElementById('p-name').value;
    if(!name) return alert("職人の名を刻んでください");
    game.name = name;

    // 1. 200問をバラバラに混ぜる
    let pool = [...masterList];
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // 2. 混ぜた後の先頭50問を今回のクイズとして固定
    game.quests = pool.slice(0, 50);

    document.getElementById('start-view').style.display = 'none';
    document.getElementById('quiz-view').style.display = 'block';
    document.getElementById('ui').style.display = 'flex';
    render();
}

function render() {
    if(game.index >= 50) return showResult();
    const q = game.quests[game.index];
    
    document.getElementById('prog').innerText = game.index + 1;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    const area = document.getElementById('opt-area');
    area.innerHTML = "";
    
    // 選択肢（o）をシャッフルして表示
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.onclick = () => check(txt, q);
        area.appendChild(b);
    });
}

function check(val, q) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';

    if(val === q.a) {
        fb.className = "fb correct";
        fb.innerHTML = "<b>【正解】 見事なり。</b>";
        if((game.index + 1) % 10 === 0) {
            game.lv++; game.hp = 100;
            document.getElementById('lv').innerText = game.lv;
            document.getElementById('hp-fill').style.width = "100%";
            fb.innerHTML += "<br><span style='color:var(--gold);'>LEVEL UP! 体力が全回復した。</span>";
        }
    } else {
        fb.className = "fb wrong";
        fb.innerHTML = `<b>【不正解】 未熟なり。</b><br>正解: ${q.a}<br><small>${q.n}</small>`;
        game.hp -= 20;
        document.getElementById('hp-fill').style.width = game.hp + "%";
    }

    if(game.hp <= 0) setTimeout(showResult, 1200);
    else document.getElementById('next-btn').style.display = 'block';
}

function nextFloor() {
    game.index++;
    render();
}

function showResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('ui').style.display = 'none';
    const r = document.getElementById('result-view');
    r.style.display = 'block';
    const win = game.hp > 0;
    const rank = win ? "伝説の衣裳主任" : "見習いスタッフ（再修業が必要）";
    r.innerHTML = "<h2>" + (win ? 'QUEST CLEAR' : 'GAME OVER') + "</h2>" +
        "<div class='rank-card'><h3>東京宝塚舞台 衣裳職人免許</h3><p><b>" + game.name + " 殿</b></p><p>評価: " + rank + "</p><p>到達Floor: " + game.index + "/50</p></div>" +
        "<button class='opt-btn' style='background:var(--gold); color:#000; text-align:center; font-weight:bold;' onclick='location.reload()'>タイトルへ戻る</button>";
}
</script>
</body>
</html>
