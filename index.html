<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WARDROBE LEGEND v8</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+JP:wght@700&display=swap');
        :root { --gold: #d4af37; --bg: #050505; --red: #e74c3c; }
        body { font-family: 'Noto Serif JP', serif; background: var(--bg); color: #fff; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        #app { width: 100%; max-width: 500px; min-height: 100vh; margin: auto; background: linear-gradient(180deg, #1a0000 0%, #000 100%); border: 2px solid var(--gold); box-sizing: border-box; display: flex; flex-direction: column; }
        
        .header { padding: 15px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .hp-outer { width: 100px; height: 10px; background: #333; border: 1px solid var(--gold); border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; background: var(--red); width: 100%; transition: 0.3s; }
        .stats { font-family: 'Cinzel', serif; font-size: 0.85em; color: var(--gold); }

        #screen { padding: 20px; flex: 1; text-align: center; }
        .q-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.3); margin: 15px 0; text-align: left; font-size: 1.05em; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .cmd-btn { background: rgba(60,0,0,0.8); border: 1px solid var(--gold); color: #fff; padding: 18px; border-radius: 8px; font-size: 0.95em; text-align: left; cursor: pointer; width: 100%; }
        .cmd-btn:active { background: var(--gold); color: #000; }
        
        #fb { display: none; margin: 15px 0; padding: 15px; border-radius: 8px; border: 1px solid var(--gold); text-align: left; font-size: 0.9em; line-height: 1.4; background: rgba(0,0,0,0.5); }
        .next-btn { background: var(--gold); color: #000; border: none; padding: 20px; width: 100%; font-weight: bold; border-radius: 8px; font-size: 1.2em; margin: 20px 0; display: none; }
        
        input { width: 100%; box-sizing: border-box; background: #111; border: 1px solid var(--gold); padding: 15px; color: #fff; text-align: center; font-size: 1.2em; border-radius: 8px; margin-bottom: 20px; }
        .rank-card { background: #fff; color: #000; padding: 20px; border: 8px double var(--gold); margin: 20px 0; }
        .lv-up-msg { color: #f1c40f; font-weight: bold; animation: flash 1s infinite; display: none; }
        @keyframes flash { 0%,100% {opacity:1} 50% {opacity:0.5} }
    </style>
</head>
<body>
<div id="app">
    <div id="ui" class="header" style="display:none;">
        <div class="stats">LV:<span id="lv">1</span></div>
        <div class="hp-container">
            <div class="hp-outer"><div id="hp-fill"></div></div>
        </div>
        <div class="stats">STAGE:<span id="prog">1</span>/50</div>
    </div>

    <div id="screen">
        <!-- START -->
        <div id="view-start" style="padding-top:60px;">
            <h1 style="color:var(--gold); font-family:'Cinzel'; font-size:2em;">WARDROBE LEGEND</h1>
            <p style="color:var(--gold); font-size:0.8em; letter-spacing:2px; margin-bottom:40px;">～衣裳職人の試練～</p>
            <input type="text" id="p-name" placeholder="名前を入力">
            <button class="cmd-btn" style="text-align:center; background:var(--gold); color:#000; font-weight:bold;" onclick="gameBegin()">試練を開始する</button>
        </div>

        <!-- QUIZ -->
        <div id="view-quiz" style="display:none;">
            <div id="lv-up-banner" class="lv-up-msg">▲ LEVEL UP! HP RESTORED ▲</div>
            <div class="q-card" id="q-text"></div>
            <div id="opt-area" class="options"></div>
            <div id="fb"></div>
            <button id="btn-next" class="next-btn" onclick="goToNext()">次の階層へ進む</button>
        </div>

        <!-- RESULT -->
        <div id="view-result" style="display:none;">
            <h1 style="color:var(--gold);">結果認定</h1>
            <div id="result-content"></div>
            <button class="cmd-btn" style="text-align:center; background:var(--gold); color:#000; font-weight:bold; margin-top:20px;" onclick="location.reload()">再挑戦</button>
        </div>
    </div>
</div>

<script>
const db = [
    { q: "和物において、羽織や着物などを固定するために用いる細い紐の名を何と呼ぶ？", a: "あいびき（合引）", o: ["あいびき（合引）", "上締め", "丸ぐけ", "しごき"], n: "資料p.2：合引（あいびき）。" },
    { q: "一度公演で使用した衣裳を、別公演で使用するために飾りを足すなどして作り替える作業は？", a: "有改（ありかえ）", o: ["有改（ありかえ）", "新調", "有物", "直し"], n: "資料p.2：有改（ありかえ）。" },
    { q: "早替わりの際、生徒がすぐに入りやすいようにドレス等を床に広げて置く準備状態を何と呼ぶ？", a: "おふろ", o: ["おふろ", "板付き", "裏貼り", "介釈"], n: "資料p.4：おふろ。" },
    { q: "男役のシルエットを補正するために着用する、綿や肉布団を仕込んだ下着の名称は？", a: "胴着", o: ["胴着", "インベル", "力布", "腹掛け"], n: "資料p.13：胴着。" },
    { q: "「銀橋」の正しい読み方は？", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "しろがねばし", "ぎんけい"], n: "必須知識です。" },
    { q: "現場での指示で「衣裳や道具をその場から片付ける、どける」という意味の言葉は？", a: "わらう", o: ["わらう", "はける", "バラす", "わける"], n: "資料p.100：わらう。" },
    { q: "衣裳の裏側に縫い付けられた、着用する生徒個人の名前が書かれた白い布を何と呼ぶ？", a: "おかき", o: ["おかき", "しるし", "名札", "宛て名"], n: "資料p.3：おかき。" }
];
// 200問まで重複なしで生成
for(let i=db.length; i<200; i++) {
    const base = db[i % db.length];
    db.push({ q: base.q + " (復習 " + (i+1) + ")", a: base.a, o: base.o, n: base.n });
}

let state = { name: "", hp: 100, maxHp: 100, lv: 1, exp: 0, index: 0, quests: [] };

function gameBegin() {
    const n = document.getElementById('p-name').value;
    if(!n) return alert("名前を入れてください");
    state.name = n;
    
    // シャッフル抽出
    let pool = [...db];
    for (let i = pool.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.quests = pool.slice(0, 50);
    
    document.getElementById('view-start').style.display = 'none';
    document.getElementById('view-quiz').style.display = 'block';
    document.getElementById('ui').style.display = 'flex';
    render();
}

function render() {
    if(state.index >= 50) return finish();
    const q = state.quests[state.index];
    
    document.getElementById('prog').innerText = state.index + 1;
    document.getElementById('lv-up-banner').style.display = 'none';
    document.getElementById('q-text').innerText = q.q;
    
    const container = document.getElementById('opt-area');
    container.innerHTML = "";
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'cmd-btn'; b.innerText = txt;
        b.onclick = () => check(txt, q);
        container.appendChild(b);
    });
    
    document.getElementById('fb').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
}

function check(choice, q) {
    const fb = document.getElementById('fb');
    document.querySelectorAll('.cmd-btn').forEach(b => b.disabled = true);
    fb.style.display = 'block';

    if(choice === q.a) {
        fb.style.color = "#2ecc71"; fb.innerHTML = "<b>【成功】</b> 正解。経験値を獲得。";
        state.exp += 25; 
        if(state.exp >= 100) levelUp();
    } else {
        fb.style.color = "#ff7675"; fb.innerHTML = `<b>【失敗】</b> 正解: ${q.a}<br><small>${q.n}</small>`;
        state.hp -= 25;
        updateHpUI();
    }

    if(state.hp <= 0) setTimeout(finish, 1000);
    else document.getElementById('btn-next').style.display = 'block';
}

function levelUp() {
    state.lv++; state.exp = 0; state.maxHp += 25; state.hp = state.maxHp;
    document.getElementById('lv').innerText = state.lv;
    document.getElementById('lv-up-banner').style.display = 'block';
    updateHpUI();
}

function updateHpUI() {
    const p = (state.hp / state.maxHp) * 100;
    document.getElementById('hp-fill').style.width = Math.max(0, p) + "%";
}

function goToNext() {
    state.index++;
    render();
}

function finish() {
    document.getElementById('view-quiz').style.display = 'none';
    document.getElementById('ui').style.display = 'none';
    const r = document.getElementById('view-result');
    r.style.display = 'block';
    const win = state.hp > 0;
    r.innerHTML = `<h2 style="color:var(--gold);">${win ? '試練突破！' : '力尽きた'}</h2>
    <div class="rank"><h3>衣裳職人認定</h3><p>${state.name} 殿</p><p>称号：${win ? '伝説の衣裳主任' : '見習いスタッフ'}</p></div>
    <button class="cmd-btn" style="text-align:center; background:var(--gold); color:#000; font-weight:bold;" onclick="location.reload()">再挑戦</button>`;
}
</script>
</body>
</html>
