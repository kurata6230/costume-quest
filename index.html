<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衣裳用語QUEST - 真・完全版</title>
    <style>
        :root { --theater-red: #700018; --gold: #d4af37; --silk: #fff; --dark: #000; }
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--dark); color: var(--silk); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; -webkit-text-size-adjust: 100%; }
        #app { width: 100%; max-width: 800px; background: linear-gradient(135deg, #2c000a 0%, #000 100%); flex: 1; display: flex; flex-direction: column; border: 3px solid var(--gold); box-sizing: border-box; margin: auto; }
        .header { background: #1a1a1a; padding: 15px; border-bottom: 1px solid var(--gold); display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; }
        .hp-bar { width: 100px; height: 10px; background: #333; border: 1px solid var(--gold); border-radius: 5px; overflow: hidden; }
        #hp-fill { height: 100%; background: #e74c3c; width: 100%; transition: 0.3s; }
        #container { padding: 15px; flex: 1; text-align: center; }
        .q-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); margin: 15px 0; text-align: left; font-size: 1.1em; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .opt-btn { background: rgba(128, 0, 32, 0.6); border: 1px solid var(--gold); padding: 18px; color: #fff; border-radius: 10px; text-align: left; font-size: 1em; width: 100%; touch-action: manipulation; }
        .opt-btn:active { background: var(--gold); color: #000; }
        #fb-box { padding: 15px; font-weight: bold; margin-top: 10px; border-radius: 8px; display: none; text-align: left; border: 1px solid var(--gold); font-size: 0.9em; }
        .nav-btn { width: 100%; background: var(--gold); color: #000; padding: 20px; font-weight: bold; border-radius: 10px; margin-top: 20px; border: none; font-size: 1.2em; display: none; touch-action: manipulation; }
        input { width: 100%; box-sizing: border-box; background: #111; border: 2px solid var(--gold); padding: 15px; color: #fff; font-size: 1.2em; text-align: center; margin-bottom: 20px; }
        .rank-card { background: #fff; color: #000; padding: 20px; border: 5px double var(--gold); margin: 20px 0; }
    </style>
</head>
<body>

<div id="app">
    <div id="ui-header" class="header" style="display:none;">
        <div>FLOOR: <span id="floor">1</span>/50</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
    </div>

    <div id="container">
        <div id="start-node">
            <h1 style="color:var(--gold); font-size:1.8em;">WARDROBE MASTER</h1>
            <p style="color:#ccc;">衣裳用語 厳選50の試練</p>
            <div style="margin: 40px 0;">
                <input type="text" id="player-name" placeholder="職人の名を刻め">
                <button id="start-btn-trigger" class="opt-btn" style="text-align:center; background:var(--gold); color:#000; font-weight:bold;">試練を開始する</button>
            </div>
        </div>

        <div id="quest-node" style="display:none;">
            <div class="q-card" id="q-text"></div>
            <div class="options" id="opt-container"></div>
            <div id="fb-box"></div>
            <button id="next-btn" class="nav-btn">次の試練へ</button>
        </div>

        <div id="result-screen" style="display:none;"></div>
    </div>
</div>

<script>
// 実戦的な150問以上のデータベース (資料p.2-18)

    { q: "「ウーリー」：タイツやTシャツ等の生地の総称を何と呼ぶか？", a: "伸びる生地", o: ["伸びる生地", "防水生地", "透ける生地", "厚手のウール生地"], n: "資料p.2。伸びる生地の衣裳全般を指します。" },
    { q: "「おかき」：衣裳の裏側に縫い付けられた「白い布」の役割は？", a: "着用者の名前を記すため", o: ["着用者の名前を記すため", "汗を吸収するため", "破れを補修するため", "演出家の印を入れるため"], n: "資料p.3。ネームタグのことです。" },
    { q: "「おふろ」：早替わりの際、床にドレス等を広げておく目的は？", a: "生徒がすぐに入り（着）やすくするため", o: ["生徒がすぐに入り（着）やすくするため", "衣裳の湿気をとるため", "床の汚れを確認するため", "衣裳を美しく見せるため"], n: "資料p.4。身体を入れる部分を広げておく状態です。" },
    { q: "「介釈（かいしゃく）」：衣裳スタッフが行う役割として正しいものは？", a: "本番中に出演者の手伝い・手助けをすること", o: ["本番中に出演者の手伝い・手助けをすること", "衣裳を裁断すること", "カツラの毛を植えること", "劇場の掃除をすること"], n: "資料p.4。舞台裏でのサポート全般を指します。" },
    { q: "「カッター」：宝塚の現場でこの言葉が指すアイテムは何か？", a: "男役のワイシャツ", o: ["男役のワイシャツ", "生地を裁断するナイフ", "舞台袖の目隠しパネル", "飾りボタン"], n: "資料p.5。前立てのあるシャツ全般のことです。" },
    { q: "「かみはや（上早）」：この場所は劇場のどこにあるか？", a: "宝塚大劇場の上手側にある早替わり室", o: ["宝塚大劇場の上手側にある早替わり室", "東京宝塚劇場の地下", "劇団のレッスン場", "衣裳の製作室"], n: "資料p.5。東京劇場の場合は「かみうえ」と呼びます。" },
    { q: "「銀橋」の正しい読み方を答えよ。", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "しろがねばし", "ぎんけい"], n: "必須知識です。宝塚特有の呼び方です。" },
    { q: "「わらう」：現場でこの指示が出た際の正しい行動は？", a: "衣裳や道具をその場から片付ける（どける）", o: ["衣裳や道具をその場から片付ける（どける）", "大きな声で笑う", "照明を明るくする", "生徒を笑顔にする"], n: "資料p.100。非常に重要な基本用語です。" },

    { q: "「蟻先（ありさき）」：和物で襴（らん）の襞が表に出ている部分を何と呼ぶか？", a: "蟻先（ありさき）", o: ["蟻先（ありさき）", "襞端", "裾先", "表襞"], n: "資料p.2。入欄（にゅうらん）の対義語です。" },
    { q: "「袷（あわせ）」：裏地のついている着物の種類を何と呼ぶか？", a: "袷（あわせ）", o: ["袷（あわせ）", "単（ひとえ）", "裏着", "重着"], n: "資料p.2。⇔単（ひとえ）。" },
    { q: "「袿（うちき）」：平安時代に女性が着用した重ね上着の名称は？", a: "袿（うちき・うちぎ）", o: ["袿（うちき・うちぎ）", "狩衣", "十二単", "直衣"], n: "資料p.2。平安貴族の代表的な衣裳です。" },
    { q: "「裏貼り（うらはり）」：衣裳の裏側に綿地などを縫い付ける主な目的は？", a: "衣裳が汚れないようにするため", o: ["衣裳が汚れないようにするため", "衣裳を重くするため", "音を響かせるため", "型崩れを防ぐため"], n: "資料p.3。汗などによる汚れ防止です。" },

    { q: "「階段飾り」：パレードの際に大階段の上に並ぶ生徒たちの呼称は？", a: "階段飾り（かいだんかざり）", o: ["階段飾り（かいだんかざり）", "背景生徒", "フィナーレ組", "パレード隊"], n: "資料p.4。演出上の重要な配置です。" },
    { q: "「抱え帯（かかえおび）」：外出時に裾をたくし上げるために用いた細い帯は？", a: "抱え帯（かかえおび）", o: ["抱え帯（かかえおび）", "腰紐", "しごき", "帯揚げ"], n: "資料p.4。現在は七五三などの装飾として残っています。" },
    { q: "「肩脱ぎ（かたぬぎ）」：和装で片袖のみを脱いだ状態の演出を何と呼ぶか？", a: "肩脱ぎ（かたぬぎ）", o: ["肩脱ぎ（かたぬぎ）", "袖落とし", "片肌脱ぎ", "半脱ぎ"], n: "資料p.5。演出上、非常に多く使われます。" },
    { q: "「裃（かみしも）」：肩衣（かたぎぬ）と袴がセットになった武士の正装は？", a: "裃（かみしも）", o: ["裃（かみしも）", "羽織袴", "直垂", "狩衣"], n: "資料p.5。共布で作られているのが特徴です。" },
    { q: "「カンカンブーツ」：フレンチカンカンなどで用いる編み上げブーツの呼称は？", a: "カンカンブーツ", o: ["カンカンブーツ", "ロケット靴", "編み上げブーツ", "娘役ブーツ"], n: "資料p.5。娘役がロケットの際などに着用します。" },
    { q: "「銀鶏（ぎんけい）」：背負い羽根（羽根）に使用される、縞模様の羽根の名称は？", a: "銀鶏（ぎんけい）", o: ["銀鶏（ぎんけい）", "金鶏", "雉（きじ）", "孔雀"], n: "資料p.6。片側のみ縞模様なのが特徴です。" },
    { q: "「座金（ザーシ）」：羽根を挿す土台となっている金具の通称は？", a: "座金（ザーシ・ざがね）", o: ["座金（ザーシ・ざがね）", "羽根受け", "土台金具", "挿し金具"], n: "資料p.7。オーストリッチの羽根を固定します。" },
    { q: "「陣羽織（じんばおり）」：武士が鎧の上に着用した上着の名称は？", a: "陣羽織（じんばおり）", o: ["陣羽織（じんばおり）", "鎧下", "合戦羽織", "武者着"], n: "資料p.9。威厳を出すために派手なものが多いです。" },
    { q: "「素襖（すおう）」：室町時代以降の簡略な礼装で、胸元に紐がある衣裳は？", a: "素襖（すおう）", o: ["素襖（すおう）", "直垂", "大紋", "狩衣"], n: "資料p.10。家紋がついているのが特徴です。" },

    { q: "「坊主（ぼうず）」：カツラを保管したり形を整えたりするための台の通称は？", a: "坊主（ぼうず）", o: ["坊主（ぼうず）", "カツラ台", "頭型", "スタンド"], n: "資料p.16。発泡スチロール製の頭型です。" },

];

let playerState = { name: "", floor: 0, hp: 100, quests: [] };

document.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.getElementById('start-btn-trigger');
    const nextBtn = document.getElementById('next-btn');

    // クエスト開始
    startBtn.addEventListener('click', () => {
        const inputName = document.getElementById('player-name').value;
        if(!inputName || inputName.trim() === "") {
            alert("職人の名を刻んでください");
            return;
        }
        playerState.name = inputName;
        // データベースから50問をランダム抽出
        playerState.quests = [...fullDb].sort(() => Math.random() - 0.5).slice(0, 50);
        
        document.getElementById('start-node').style.display = 'none';
        document.getElementById('quest-node').style.display = 'block';
        document.getElementById('ui-header').style.display = 'flex';
        renderFloor();
    });

    // 次へ進む
    nextBtn.addEventListener('click', () => {
        playerState.floor++;
        renderFloor();
    });
});

function renderFloor() {
    if(playerState.floor >= playerState.quests.length) return showResult();
    const q = playerState.quests[playerState.floor];
    
    document.getElementById('floor').innerText = playerState.floor + 1;
    document.getElementById('q-text').innerText = q.q;
    
    const optArea = document.getElementById('opt-container');
    optArea.innerHTML = "";
    
    const shuffledOpts = [...q.o].sort(() => Math.random() - 0.5);
    shuffledOpts.forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.addEventListener('click', () => checkAnswer(txt, q));
        optArea.appendChild(b);
    });
    
    document.getElementById('fb-box').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
}

function checkAnswer(ans, q) {
    const fb = document.getElementById('fb-box');
    fb.style.display = 'block';
    const btns = document.querySelectorAll('.opt-btn');
    btns.forEach(b => b.disabled = true);

    if(ans === q.a) {
        fb.className = "fb correct";
        fb.innerHTML = "【正解】 CRITICAL HIT!";
    } else {
        fb.className = "fb wrong";
        fb.innerHTML = `【不正解】 DAMAGED!<br>正解: ${q.a}<br><small>解説: ${q.n}</small>`;
        playerState.hp -= 20;
        document.getElementById('hp-fill').style.width = playerState.hp + "%";
    }

    if(playerState.hp <= 0) {
        setTimeout(showResult, 1500);
    } else {
        document.getElementById('next-btn').style.display = 'block';
    }
}

function showResult() {
    document.getElementById('quest-node').style.display = 'none';
    document.getElementById('ui-header').style.display = 'none';
    const r = document.getElementById('result-screen');
    r.style.display = 'block';
    
    const status = playerState.hp > 0 ? "合格：伝説の衣裳主任" : "不合格：見習いスタッフ";
    
    r.innerHTML = `
        <h1 style="color:var(--gold);">${playerState.hp > 0 ? 'QUEST CLEAR' : 'RETIRE'}</h1>
        <div class="rank-card">
            <h3>衣裳職人免許状</h3>
            <p style="font-size:1.4em; font-weight:bold;">${playerState.name} 殿</p>
            <p>称号：${status}</p>
            <p>正解数: ${playerState.hp > 0 ? 50 : playerState.floor}/50</p>
        </div>
        <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;" onclick="location.reload()">再挑戦</button>
    `;
}
</script>
</body>
</html>
