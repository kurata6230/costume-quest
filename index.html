<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衣裳用語QUEST v9</title>
    <style>
        :root { --gold: #d4af37; --bg: #0a0a0a; --red: #e74c3c; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
        #app { width: 100%; max-width: 500px; min-height: 100vh; margin: auto; background: #1a0000; border: 2px solid var(--gold); display: flex; flex-direction: column; box-sizing: border-box; }
        
        /* ヘッダー */
        .header { background: #000; padding: 10px 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .hp-bar { width: 100px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; border: 1px solid var(--gold); }
        #hp-fill { height: 100%; background: var(--red); width: 100%; transition: 0.3s; }
        
        /* メインエリア */
        #container { padding: 15px; flex: 1; display: flex; flex-direction: column; text-align: center; }
        .q-card { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 12px; border-left: 5px solid var(--gold); text-align: left; font-size: 1.1em; line-height: 1.4; margin-bottom: 20px; }
        
        /* ボタン */
        .opt-btn { background: #2c2c2c; border: 1px solid #444; padding: 18px; color: #fff; border-radius: 8px; text-align: left; font-size: 1em; width: 100%; margin-bottom: 10px; touch-action: manipulation; }
        .opt-btn:active { background: var(--gold); color: #000; }
        
        /* 次へ進むボタン（画面下部に大きく固定） */
        .nav-btn { background: var(--gold); color: #000; border: none; padding: 22px; width: 100%; font-weight: bold; font-size: 1.3em; position: sticky; bottom: 0; display: none; touch-action: manipulation; z-index: 100; }
        
        #fb { display: none; margin-bottom: 15px; padding: 15px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(0,0,0,0.8); text-align: left; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--gold); color: #fff; text-align: center; font-size: 1.2em; border-radius: 8px; margin-bottom: 20px; box-sizing: border-box; }
        .ver { font-size: 10px; color: #444; margin-top: 10px; }
    </style>
</head>
<body>

<div id="app">
    <!-- UI -->
    <div id="ui" class="header" style="display:none;">
        <div style="color:var(--gold); font-size:0.8em;">STAGE: <span id="prog">1</span>/50</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <div style="color:var(--gold); font-size:0.8em;">LV: <span id="lv">1</span></div>
    </div>

    <div id="container">
        <!-- START SCREEN -->
        <div id="start-view" style="padding-top:50px;">
            <h1 style="color:var(--gold); margin:0;">WARDROBE QUEST</h1>
            <p style="color:#888; font-size:0.8em; letter-spacing:2px; margin-bottom:40px;">～衣裳職人の試練～</p>
            <input type="text" id="user-name" placeholder="なまえを入力">
            <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;" onclick="handleStart()">試練を開始する</button>
            <div class="ver">Ver 9.0 (Ultra Stable Mode)</div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-view" style="display:none;">
            <div class="q-card" id="q-text"></div>
            <div id="opt-area"></div>
            <div id="fb"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-view" style="display:none;">
            <h2 id="res-title" style="color:var(--gold);"></h2>
            <div id="res-body" style="background:#fff; color:#000; padding:20px; border:5px double var(--gold); margin:20px 0;"></div>
            <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;" onclick="location.reload()">再挑戦する</button>
        </div>
    </div>

    <!-- NEXT BUTTON (STAY AT BOTTOM) -->
    <button id="next-btn" class="nav-btn" onclick="handleNext()">次の階層へ進む ▶</button>
</div>

<script>
const masterDb = [
    { q: "和物において、羽織や着物などを固定するために用いる細い紐の名を何と呼ぶ？", a: "あいびき（合引）", o: ["あいびき（合引）", "上締め", "丸ぐけ", "しごき"], n: "資料p.2：合引（あいびき）。" },
    { q: "一度公演で使用した衣裳を、別公演で使用するために飾りを足すなどして作り替える作業は？", a: "有改（ありかえ）", o: ["有改（ありかえ）", "新調", "有物", "直し"], n: "資料p.2：有改（ありかえ）。" },
    { q: "早替わりの際、生徒がすぐに入りやすいようにドレス等を広げて置く準備状態を何と呼ぶ？", a: "おふろ", o: ["おふろ", "板付き", "裏貼り", "介釈"], n: "資料p.4：おふろ。" },
    { q: "男役のシルエットを補正するために着用する、綿や肉布団を仕込んだ下着の名称は？", a: "胴着", o: ["胴着", "インベル", "力布", "腹掛け"], n: "資料p.13：胴着。" },
    { q: "「銀橋」の正しい読み方は？", a: "ぎんきょう", o: ["ぎんきょう", "ぎんばし", "しろがねばし", "ぎンけい"], n: "必須知識です。" },
    { q: "現場での指示で「衣裳や道具を片付ける、どける」という意味の言葉は？", a: "わらう", o: ["わらう", "はける", "バラす", "わける"], n: "資料p.100：わらう。" },
    { q: "衣裳の裏側に縫い付けられた、着用する生徒個人の名前が書かれた白い布を何と呼ぶ？", a: "おかき", o: ["おかき", "しるし", "名札", "宛て名"], n: "資料p.3：おかき。" }
];

// 200問まで増設
for(let i=masterDb.length; i<200; i++){
    let b = masterDb[i % masterDb.length];
    masterDb.push({q: b.q + " (復習"+(i+1)+")", a: b.a, o: b.o, n: b.n});
}

let state = { name:"", hp:100, lv:1, exp:0, index:0, quests:[] };

function handleStart() {
    const val = document.getElementById('user-name').value;
    if(!val) return alert("名前を入れてください");
    state.name = val;
    
    // 重複なしシャッフル抽出
    let pool = [...masterDb];
    for (let i = pool.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    state.quests = pool.slice(0, 50);

    document.getElementById('start-view').style.display = 'none';
    document.getElementById('quiz-view').style.display = 'block';
    document.getElementById('ui').style.display = 'flex';
    render();
}

function render() {
    if(state.index >= 50) return showResult();
    const q = state.quests[state.index];
    
    document.getElementById('prog').innerText = state.index + 1;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    
    const area = document.getElementById('opt-area');
    area.innerHTML = "";
    [...q.o].sort(()=>Math.random()-0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.onclick = () => check(txt, q);
        area.appendChild(b);
    });
}

function check(choice, q) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';

    if(choice === q.a) {
        fb.style.color = "#2ecc71"; fb.innerHTML = "<b>【正解】</b> その通りです。";
        state.exp += 25;
        if(state.exp >= 100) {
            state.lv++; state.exp = 0; state.hp = 100;
            document.getElementById('lv').innerText = state.lv;
            fb.innerHTML += "<br><span style='color:yellow;'>LEVEL UP! HP回復！</span>";
        }
    } else {
        fb.style.color = "#ff7675"; fb.innerHTML = "<b>【不正解】</b> 正解: " + q.a + "<br><small>" + q.n + "</small>";
        state.hp -= 25;
    }
    
    document.getElementById('hp-fill').style.width = state.hp + "%";
    
    if(state.hp <= 0) {
        setTimeout(showResult, 1000);
    } else {
        // ここで「次へ進む」ボタンを確実に出す
        document.getElementById('next-btn').style.display = 'block';
    }
}

function handleNext() {
    state.index++;
    render();
}

function showResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('ui').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    const r = document.getElementById('result-view');
    r.style.display = 'block';
    const win = state.hp > 0;
    document.getElementById('res-title').innerText = win ? "試練突破！" : "リタイア";
    document.getElementById('res-body').innerHTML = "<h3>衣裳職人認定</h3><p>" + state.name + " 殿</p><p>称号: " + (win ? "伝説の衣裳主任" : "見習いスタッフ") + "</p>";
}
</script>
</body>
</html>
