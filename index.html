    { q: "現場の指示用語で「わらう」の反対語にあたる「道具を出す」を指すのはどれか？", a: "押し（または出し）", o: ["押し（または出し）", "笑い", "掃き", "片付け"], n: "動作指示。" }
];

let game = { name: "", hp: 100, index: 0, quests: [], lv: 1 };

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-start').addEventListener('click', () => {
        const n = document.getElementById('p-name-input').value;
        if(!n) { alert("職人の名を刻んでください"); return; }
        game.name = n;
        // 完全重複なしシャッフル（Fisher-Yates）
        let pool = JSON.parse(JSON.stringify(masterDatabase)); // データをコピー
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        game.quests = pool;
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        document.getElementById('ui-header').style.display = 'flex';
        renderQuestion();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        game.index++;
        renderQuestion();
    });
});

function renderQuestion() {
    if(game.index >= 100) { showResult(); return; }
    const q = game.quests[game.index];
    document.getElementById('prog').innerText = game.index + 1;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    const area = document.getElementById('opt-area');
    area.innerHTML = "";
    // 選択肢も混ぜる
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.onclick = () => checkAnswer(txt, q);
        area.appendChild(b);
    });
}

function checkAnswer(val, q) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';
    if(val === q.a) {
        fb.style.color = "#2ecc71"; fb.innerHTML = "<b>【成功】 正解なり。</b>";
        if((game.index + 1) % 10 === 0) {
            game.lv++; game.hp = 100;
            document.getElementById('lv').innerText = game.lv;
            document.getElementById('hp-fill').style.width = "100%";
            fb.innerHTML += "<br><span style='color:var(--gold)'>▲ LV UP! 全回復 ▲</span>";
        }
    } else {
        fb.style.color = "#ff7675"; fb.innerHTML = `<b>【不覚】 正解は「${q.a}」なり。</b>`;
        game.hp -= 10;
        document.getElementById('hp-fill').style.width = game.hp + "%";
    }
    if(game.hp <= 0) setTimeout(showResult, 1500);
    else document.getElementById('btn-next').style.display = 'block';
}

function showResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('ui-header').style.display = 'none';
    const r = document.getElementById('result-view');
    r.style.display = 'block';
    const win = game.hp > 0;
    r.innerHTML = `<h2>${win ? '全試練完遂！' : '修業不足'}</h2>
        <div class='rank-card'><h3>衣裳職人免許状</h3><p><b>${game.name} 殿</b></p><p>正解数: ${game.index}/100</p></div>
        <button class='opt-btn' style='background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:20px;' onclick='location.reload()'>最初からやり直す</button>`;
}
</script>
