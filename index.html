];

let playerState = { name: "", hp: 100, index: 0, quests: [], lv: 1, exp: 0 };

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-start').addEventListener('click', () => {
        const input = document.getElementById('p-name-input').value;
        if(!input) { alert("名を名乗れ！"); return; }
        playerState.name = input;
        
        // --- 100問をフィッシャー・イェーツで完全にシャッフル ---
        let pool = JSON.parse(JSON.stringify(masterDatabase));
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        playerState.quests = pool; // これで重複は100%排除される
        
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        document.getElementById('ui-header').style.display = 'flex';
        renderFloor();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        playerState.index++;
        renderFloor();
    });
});

function renderFloor() {
    if(playerState.index >= 100) { showFinalResult(); return; }
    const q = playerState.quests[playerState.index];
    
    document.getElementById('prog').innerText = playerState.index + 1;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    const optArea = document.getElementById('opt-area');
    optArea.innerHTML = "";
    // 選択肢も混ぜる
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.addEventListener('click', () => check(txt, q));
        optArea.appendChild(b);
    });
}

function check(choice, q) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';
    if(choice === q.a) {
        fb.style.color = "#2ecc71"; fb.innerHTML = "<b>【成功】 正しき知識だ。</b>";
        playerState.exp += 25;
        if(playerState.exp >= 100) {
            playerState.lv++; playerState.exp = 0; playerState.hp = 100;
            document.getElementById('lv').innerText = playerState.lv;
            document.getElementById('hp-fill').style.width = "100%";
            fb.innerHTML += "<br><span style='color:var(--gold)'>▲ LEVEL UP! 体力全回復 ▲</span>";
        }
    } else {
        fb.style.color = "#ff7675"; fb.innerHTML = `<b>【不覚】 答えは「${q.a}」なり。</b><br><small>${q.n}</small>`;
        playerState.hp -= 20;
        document.getElementById('hp-fill').style.width = Math.max(0, playerState.hp) + "%";
    }
    if(playerState.hp <= 0) setTimeout(showFinalResult, 1500);
    else document.getElementById('btn-next').style.display = 'block';
}

function showFinalResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('ui-header').style.display = 'none';
    const r = document.getElementById('result-view');
    r.style.display = 'block';
    const win = playerState.hp > 0;
    r.innerHTML = `<h2>${win ? '全試練完遂！' : '修業不足'}</h2>
        <div class="rank-card"><h3>衣裳職人免許状</h3><p><b>${playerState.name} 殿</b></p><p>正解数: ${playerState.index}/100</p></div>
        <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:20px;" onclick="location.reload()">最初からやり直す</button>`;
}
</script>
