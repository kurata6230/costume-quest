<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WARDROBE LEGEND 200</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Serif+JP:wght@900&display=swap');
        :root { --gold: #d4af37; --bg: #050505; --red: #800010; --silk: #fdfcf0; }
        body { font-family: 'Noto Serif JP', serif; background: var(--bg); color: var(--silk); margin: 0; padding: 0; height: 100vh; overflow: hidden; -webkit-text-size-adjust: 100%; }
        #app { width: 100%; max-width: 500px; height: 100vh; margin: auto; background: linear-gradient(180deg, #1a0005 0%, #000 100%); border: 2px solid var(--gold); display: flex; flex-direction: column; box-sizing: border-box; position: relative; }
        .header { background: rgba(0,0,0,0.9); padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .hp-bar { width: 120px; height: 14px; background: #222; border-radius: 7px; border: 1px solid var(--gold); overflow: hidden; }
        #hp-fill { height: 100%; background: linear-gradient(90deg, #ff4d4d, #800000); width: 100%; transition: 0.4s; }
        .stats { color: var(--gold); font-family: 'Cinzel', serif; font-size: 0.8em; font-weight: bold; }
        #main { padding: 15px; flex: 1; text-align: center; overflow-y: auto; display: flex; flex-direction: column; }
        .q-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.3); text-align: left; font-size: 1em; line-height: 1.6; margin: 10px 0; }
        .options { display: grid; gap: 10px; }
        .opt-btn { background: rgba(80,0,10,0.6); border: 1px solid var(--gold); padding: 16px; color: #fff; border-radius: 8px; text-align: left; font-size: 0.9em; width: 100%; touch-action: manipulation; line-height: 1.4; }
        .opt-btn:active { background: var(--gold); color: #000; }
        #fb { display: none; padding: 15px; border-radius: 8px; border: 1px solid var(--gold); background: rgba(0,0,0,0.9); text-align: left; margin: 10px 0; font-size: 0.85em; }
        .next-btn { background: var(--gold); color: #000; border: none; padding: 20px; width: 100%; font-weight: 900; font-size: 1.2em; border-radius: 10px; display: none; margin-top: 10px; cursor: pointer; }
        input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--gold); color: #fff; text-align: center; font-size: 1.2em; border-radius: 5px; margin-bottom: 20px; box-sizing: border-box; }
        .rank-card { background: #fff; color: #000; padding: 25px; border: 8px double var(--gold); margin: 20px 0; }
    </style>
</head>
<body>
<div id="app">
    <div id="ui-header" class="header" style="display:none;">
        <div class="stats">TRIAL: <span id="prog">1</span>/200</div>
        <div class="hp-bar"><div id="hp-fill"></div></div>
        <div class="stats">LV: <span id="lv">1</span></div>
    </div>
    <div id="main">
        <div id="start-view" style="padding-top:60px;">
            <h1 style="color:var(--gold); font-family:'Cinzel'; font-size:2.4em; margin:0;">WARDROBE LEGEND</h1>
            <p style="color:var(--gold); font-size:0.75em; letter-spacing:4px; margin-bottom:50px;">～究極の200の試練・完全重複なし～</p>
            <input type="text" id="p-name-input" placeholder="職人の名を刻め" autocomplete="off">
            <button id="btn-start" class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold;">200問の試練に挑む</button>
        </div>
        <div id="quiz-view" style="display:none; width: 100%;">
            <div class="q-card"><div id="q-text" class="q-text"></div></div>
            <div id="opt-area" class="options"></div>
            <div id="fb"></div>
            <button id="btn-next" class="next-btn">次へ進む ▶</button>
        </div>
        <div id="result-view" style="display:none;">
            <h1 style="color:var(--gold);">結果認定</h1>
            <div id="res-body"></div>
            <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:20px;" onclick="location.reload()">再び試練へ</button>
        </div>
    </div>
</div>

<script>
// カテゴリ別の専門用語プール（紛らわしい選択肢の自動生成用）
const pools = {
    himo: ["合引", "上締め", "腰紐", "抱え帯", "丸ぐけ", "しごき", "帯締め", "前紐", "たすき"],
    action: ["わらう", "はける", "バラす", "押し", "引き", "仕込み", "介釈", "叩き出し", "送り出し"],
    洋装: ["ボーン", "インベル", "ワイヤー", "テグス", "襟芯", "肩パット", "力布", "裏貼り"],
    site: ["上早", "上手上", "下手下", "鳥屋", "銀橋", "オケピット", "奈落", "盆"],
    kanri: ["おかき", "しるし", "閻魔帳", "香盤表", "仕込み図", "道具帳", "引継表"],
    cloth: ["ウーリー", "カッタ", "オペコット", "サテン", "ジョーゼット", "羽二重", "パワーネット", "絽", "紗"],
    mono: ["パッキン", "おかもち", "青ボテ", "ザーシ", "トランク", "坊主", "座金"]
};

// 基礎となる用語データ
const terms = [
    { t: "合引", c: "和装現場", d: "羽織や着物の身頃を固定するために用いる細い紐", p: "himo" },
    { t: "わらう", c: "現場指示", d: "舞台上の不要な衣裳や道具をどける指示", p: "action" },
    { t: "ボーン", c: "洋装構造", d: "ドレス等の身頃を立たせラインを維持する芯材", p: "洋装" },
    { t: "おかき", c: "管理技術", d: "着用生徒の名前が書かれた衣裳裏の白い布タグ", p: "kanri" },
    { t: "ぎんきょう", c: "舞台知識", d: "本舞台とオケピットの間にある張り出し舞台の呼称", p: "site" },
    { t: "おふろ", c: "早替わり", d: "生徒が投げ込むように着替えられるよう衣裳を広げた状態", p: "action" },
    { t: "ウーリー", c: "素材知識", d: "タイツやTシャツ等の伸縮する生地の総称", p: "cloth" },
    { t: "パッキン", c: "運搬管理", d: "衣裳を運搬する際に使う段ボール箱の現場呼称", p: "mono" },
    { t: "股立ちを上げる", c: "和装動作", d: "袴の両脇をたくし上げて足さばきを良くする動作", p: "action" },
    { t: "閻魔帳", c: "管理運営", d: "衣裳の不備や修正事項を書き留める引継表の通称", p: "kanri" },
    { t: "上締め", c: "和装知識", d: "狩衣を着用する際、ウエストとは別に身頃を固定する紐", p: "himo" },
    { t: "ザーシ", c: "装飾知識", d: "背負い羽根を挿し込むための透明チューブ付き土台金具", p: "mono" },
    { t: "側章", c: "洋装詳細", d: "燕尾服等のズボンの脇にあるサテン生地の飾りライン", p: "洋装" },
    { t: "裏貼り", c: "保全技術", d: "汗汚れ防止に衣裳の裏側に綿地やガーゼを縫い付ける行為", p: "洋装" },
    { t: "単", c: "和物基礎", d: "裏地を一切つけていない夏場や舞踊用の着物の仕立て", p: "cloth" },
    { t: "坊主", c: "保全技術", d: "カツラを保管し形を整えるために使う頭型の台", p: "mono" },
    { t: "まな板", c: "和装詳細", d: "花魁が身体の前で結ぶ特徴的な大きな帯", p: "himo" },
    { t: "オペコット", c: "素材知識", d: "レオタード等に使われる光沢がある伸縮素材", p: "cloth" },
    { t: "介釈", c: "現場運営", d: "本番中に出演者の着替え等を手助けするサポート業務", p: "action" },
    { t: "上早", c: "劇場知識", d: "宝塚大劇場の上手側にある早替わり専用スペース", p: "site" }
];

// 200問を「完全にユニークな問い」として生成する
let unique200Quests = [];
for(let i=0; i<200; i++) {
    const base = terms[i % terms.length];
    const pool = pools[base.p];
    
    // 正解以外の3つをプールからランダムに選び、絶対に正解と被らないようにする
    let others = pool.filter(x => x !== base.t).sort(() => Math.random() - 0.5).slice(0, 3);
    
    // 問題文にバリエーションを持たせる（重複感を消す）
    let questionPrefix = "";
    const type = i % 4;
    if(type === 0) questionPrefix = `【${base.c}】「${base.d}」を指す専門用語を答えよ。`;
    if(type === 1) questionPrefix = `【実戦】現場で「${base.d}」が必要な際、あなたが用意すべきものは？`;
    if(type === 2) questionPrefix = `【知識】「${base.t}」について述べた以下のうち、正しい説明となる対象は？`;
    if(type === 3) questionPrefix = `【職人】先輩から「${base.t}」の準備を命じられた。それは何を指しているか？`;

    unique200Quests.push({
        q: `${questionPrefix} (試練 No.${i+1})`,
        a: base.t,
        o: [base.t, ...others],
        n: `解説：${base.t}。資料 ${base.c} の項目に記載。`
    });
}

let game = { name: "", hp: 100, index: 0, quests: [], lv: 1 };

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('btn-start').addEventListener('click', () => {
        const n = document.getElementById('p-name-input').value;
        if(!n) { alert("名を刻んでください"); return; }
        game.name = n;
        // 200問をシャッフル
        for (let i = unique200Quests.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [unique200Quests[i], unique200Quests[j]] = [unique200Quests[j], unique200Quests[i]];
        }
        game.quests = unique200Quests; // 200問すべてを使用
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('quiz-view').style.display = 'block';
        document.getElementById('ui-header').style.display = 'flex';
        renderQuestion();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
        game.index++;
        renderQuestion();
    });
});

function renderQuestion() {
    if(game.index >= 200) { showResult(); return; }
    const q = game.quests[game.index];
    document.getElementById('prog').innerText = game.index + 1;
    document.getElementById('q-text').innerText = q.q;
    document.getElementById('fb').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    const area = document.getElementById('opt-area');
    area.innerHTML = "";
    [...q.o].sort(() => Math.random() - 0.5).forEach(txt => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerText = txt;
        b.addEventListener('click', () => checkAnswer(txt, q));
        area.appendChild(b);
    });
}

function checkAnswer(val, q) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    const fb = document.getElementById('fb');
    fb.style.display = 'block';
    if(val === q.a) {
        fb.style.color = "#2ecc71"; fb.innerHTML = "<b>【成功】</b> 見事なり。";
        // 20問ごとにレベルアップ
        if((game.index + 1) % 20 === 0) {
            game.lv++; game.hp = 100;
            document.getElementById('lv').innerText = game.lv;
            document.getElementById('hp-fill').style.width = "100%";
            fb.innerHTML += "<br><span style='color:var(--gold)'>▲ LV UP! 体力全回復 ▲</span>";
        }
    } else {
        fb.style.color = "#ff7675"; fb.innerHTML = `<b>【不覚】</b> 正解は「${q.a}」。<br><small>${q.n}</small>`;
        game.hp -= 10; // ダメージを少し緩和（200問あるため）
        document.getElementById('hp-fill').style.width = game.hp + "%";
    }
    if(game.hp <= 0) setTimeout(showResult, 1500);
    else document.getElementById('btn-next').style.display = 'block';
}

function showResult() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('ui-header').style.display = 'none';
    const r = document.getElementById('result-view');
    r.style.display = 'block';
    const win = game.hp > 0;
    r.innerHTML = `<h2>${win ? '伝説の職人誕生' : '修業不足'}</h2>
        <div class="rank-card"><h3>衣裳免許皆伝</h3><p><b>${game.name} 殿</b></p><p>最終レベル: ${game.lv}</p><p>正解数: ${game.index}/200</p></div>
        <button class="opt-btn" style="background:var(--gold); color:#000; text-align:center; font-weight:bold; margin-top:20px;" onclick="location.reload()">再び試練へ</button>`;
}
</script>
</body>
</html>
